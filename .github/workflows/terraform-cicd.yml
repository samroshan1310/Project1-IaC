name: Terraform Infra CI/CD

on:
  push:
    branches: [main]
    paths:
      - "**.tf"
      - ".github/workflows/terraform-cicd.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  TF_VERSION: "1.7.5"

jobs:
  # ---------------------------------------------------------------------
  # Stage 1: Lint & validate. Fast fail before anything talks to Azure.
  # ---------------------------------------------------------------------
  validate:
    name: Terraform Validate & tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend, validate only)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4

      - name: Run tflint
        run: tflint --recursive

  # ---------------------------------------------------------------------
  # Stage 2: Security scanning. Pipeline fails the build on high/critical
  # findings -- this is the DevSecOps gate the project calls for.
  # ---------------------------------------------------------------------
  security_scan:
    name: Checkov & tfsec Security Scan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,checkov-results.sarif
          soft_fail: false

      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-results.sarif
        continue-on-error: true

      - name: Run tfsec
        uses: aquasecurity/tfsec-sarif-action@v0.1.4
        with:
          sarif_file: tfsec-results.sarif

      - name: Upload tfsec SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: tfsec-results.sarif
        continue-on-error: true

  # ---------------------------------------------------------------------
  # Stage 3: Plan. Runs on every PR and push; produces an artifact that
  # the apply job re-uses so what gets approved is exactly what gets
  # applied (no drift between plan and apply steps).
  # ---------------------------------------------------------------------
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: security_scan
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="subscription_id=${{ secrets.ARM_SUBSCRIPTION_ID }}" \
            -backend-config="resource_group_name=${{ secrets.EXISTING_RESOURCE_GROUP_NAME }}" \
            -backend-config="storage_account_name=${{ secrets.BACKEND_STORAGE_ACCOUNT_NAME }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=project1.terraform.tfstate" \
            -backend-config="access_key=${{ secrets.BACKEND_ACCESS_KEY }}"

      - name: Terraform plan
        run: |
          terraform plan \
            -var="admin_cidr=${{ secrets.ADMIN_CIDR }}" \
            -var="existing_resource_group_name=${{ secrets.EXISTING_RESOURCE_GROUP_NAME }}" \
            -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan
          retention-days: 1

  # ---------------------------------------------------------------------
  # Stage 4: Apply. Gated behind the "production" GitHub Environment,
  # which requires a manual reviewer approval -- this is the manual
  # approval gate called for in the project's pipeline design.
  # ---------------------------------------------------------------------
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="subscription_id=${{ secrets.ARM_SUBSCRIPTION_ID }}" \
            -backend-config="resource_group_name=${{ secrets.EXISTING_RESOURCE_GROUP_NAME }}" \
            -backend-config="storage_account_name=${{ secrets.BACKEND_STORAGE_ACCOUNT_NAME }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=project1.terraform.tfstate" \
            -backend-config="access_key=${{ secrets.BACKEND_ACCESS_KEY }}"

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan
